name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  shellcheck-lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "."
          severity: warning

  bash-syntax:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate bash syntax
        run: |
          bash -n install.sh
          bash -n update.sh
          bash -n verify.sh
          bash -n uninstall.sh
          bash -n scripts/common.sh
          bash -n scripts/export-full-clone.sh

  format-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install shfmt
        run: |
          sudo apt-get update
          sudo apt-get install -y shfmt

      - name: Check shell formatting
        run: shfmt -d -i 2 -ci install.sh update.sh verify.sh uninstall.sh scripts/common.sh scripts/export-full-clone.sh

  verify-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create mock openclaw CLI
        run: |
          mkdir -p .ci/bin
          cat > .ci/bin/openclaw <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          if [ "${1:-}" = "skills" ] && [ "${2:-}" = "list" ]; then
            cat <<'SKILLS'
          weather
          browser-automation
          acp-router
          SKILLS
            exit 0
          fi
          if [ "${1:-}" = "--version" ]; then
            echo "openclaw mock 0.0.0"
            exit 0
          fi
          exit 0
          EOF
          chmod +x .ci/bin/openclaw

      - name: Run verify.sh
        run: PATH="$GITHUB_WORKSPACE/.ci/bin:$PATH" bash verify.sh

  test-install:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Exercise installer entry points
        run: |
          bash install.sh --accept-defaults --dry-run --skip-engram
          bash install.sh --version
          bash install.sh --help
          bash update.sh --version

  test-full-clone:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create mock ~/.openclaw fixture
        run: |
          mkdir -p "$HOME/.openclaw/credentials" "$HOME/.openclaw/identity" "$HOME/.openclaw/workspace/project/config"
          echo '{}' > "$HOME/.openclaw/openclaw.json"
          echo 'fake-token' > "$HOME/.openclaw/credentials/token.txt"
          echo 'fake-id' > "$HOME/.openclaw/identity/device.json"
          echo 'config' > "$HOME/.openclaw/workspace/AGENTS.md"
          echo 'repo-env' > "$HOME/.openclaw/workspace/project/.env"
          echo 'secret' > "$HOME/.openclaw/workspace/project/config/api_key.txt"
          echo 'secret' > "$HOME/.openclaw/workspace/project/token-cache.json"

      - name: Export default bundle excludes identity/credentials/secrets
        run: |
          mkdir -p out
          bash scripts/export-full-clone.sh --output out
          BUNDLE=$(ls out/lucy-full-clone-*.tar.gz)
          if tar -tzf "$BUNDLE" | grep -qE 'identity|credentials|\.env|token|secret|api_key'; then
            echo "FAIL: default bundle leaked identity/credentials/secrets"
            tar -tzf "$BUNDLE"
            exit 1
          fi
          echo "OK: default bundle excludes identity/credentials/secrets"

      - name: Export with --include-identity includes them
        run: |
          mkdir -p out2
          bash scripts/export-full-clone.sh --include-identity --output out2
          BUNDLE=$(ls out2/lucy-full-clone-*.tar.gz)
          if ! tar -tzf "$BUNDLE" | grep -qE 'identity/device.json|credentials/token.txt'; then
            echo "FAIL: --include-identity bundle missing identity/credentials"
            exit 1
          fi
          echo "OK: --include-identity bundle includes identity/credentials"

      - name: Mutually exclusive flags are rejected
        run: |
          if bash install.sh --full-clone ./out/lucy-full-clone-*.tar.gz --skip-workspace --dry-run 2>/dev/null; then
            echo "FAIL: --full-clone + --skip-workspace should be rejected"
            exit 1
          fi
          echo "OK: --full-clone rejects conflicting flags"
